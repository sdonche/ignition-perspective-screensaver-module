name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'web/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # `build` depends on `check`, which runs the web Jest tests. The node
      # plugin downloads its own Node; web deps install from npm + the Inductive
      # Automation nexus registry (web/.npmrc). Unsigned module in CI.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: "false"

  # Drives the Idle Guard in a real Perspective session: ops/e2e.sh --fresh
  # boots the compose gateway unattended (headless commissioning, dev-signed
  # module pre-accepted via data/modules.json) and runs the Playwright suite.
  e2e:
    # The pinned image is the gate. The "latest" 8.3 image is informational
    # (continue-on-error): it tells us early when Ignition moves the alarm or
    # component-delegate APIs under the guard, without blocking a merge on
    # Inductive Automation's release day.
    name: E2E (Playwright, Ignition ${{ matrix.ignition }})
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    continue-on-error: ${{ matrix.ignition != '8.3.6' }}
    strategy:
      fail-fast: false
      matrix:
        ignition: ['8.3.6', 'latest']
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'web/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Bring up gateway and run the suite
        run: ops/e2e.sh --fresh
        env:
          IGNITION_IMAGE: ${{ matrix.ignition }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.ignition }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Gateway logs on failure
        if: failure()
        run: docker logs mscreen-ignition --tail 200
